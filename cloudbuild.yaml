steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/healthguard:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/healthguard:latest'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/healthguard:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - 'deploy'
      - 'healthguard'
      - '--image=gcr.io/$PROJECT_ID/healthguard:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--port=3100'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=60'
      - '--allow-unauthenticated'
      - '--set-secrets=GOOGLE_GEMINI_API_KEY=healthguard-gemini-key:latest'
      - '--set-env-vars=NODE_ENV=production,PORT=3100,FHIR_BASE_URL=https://hapi.fhir.org/baseR4,MCP_SERVER_NAME=healthguard,MCP_SERVER_VERSION=0.2.0,GEMINI_MODEL=gemini-2.0-flash,AUDIT_HASH_ALGORITHM=sha256,PHI_LOGGING_ENABLED=false,IB_EXCEPTIONS_VERSION=2024'

images:
  - 'gcr.io/$PROJECT_ID/healthguard:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/healthguard:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
